# Product-shaped fixture for issue #30 — NOT a live product conf.
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include conf.d/*.conf;
    include sites-enabled/*;
    server {
        listen 80;
        listen 443 ssl;
        listen 127.0.0.1:8080 ssl https_allow_http;
        listen 127.0.0.1:8443 ssl https_allow_http;
        server_name reserved-real;
    }
}
