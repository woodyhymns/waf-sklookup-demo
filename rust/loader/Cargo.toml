[package]
name = "waf-sklookup-loader"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust userspace loader for selectable C or Rust sk_lookup BPF"
publish = false

[[bin]]
name = "waf-sklookup-loader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
libbpf-rs = "0.25"
libbpf-sys = "1.5"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
libbpf-cargo = "0.25"
