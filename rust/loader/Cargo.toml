[package]
name = "waf-sklookup-loader"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust userspace loader for waf-sklookup-demo (C BPF unchanged)"
publish = false

[[bin]]
name = "waf-sklookup-loader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
libbpf-rs = "0.25"

[build-dependencies]
libbpf-cargo = "0.25"
