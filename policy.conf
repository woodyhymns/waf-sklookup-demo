# deny extra ports (the built-in five are always denied)
deny=22,25,53,3306,6379
# Management/fixed-listener reservation. Dynamic wildcard bindings must never
# claim these endpoints. Add every custom metrics/ctl/SSH/host-agent/health
# listener in the same network namespace, or use a separate management VIP.
reserve=8080,8443,9101
# privileged allowlist
allow_privileged=
max_ports_per_tenant=32
max_ports_per_machine=128
