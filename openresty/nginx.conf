# P1 demo config for stock OpenResty 1.19.3.2.
#
# Product architecture (Tengine 3.1.0+): ONE internal listen accepts both
# plaintext HTTP and TLS. Protocol discrimination is OpenResty/Tengine, not
# sk_lookup. Verified listen syntax (Tengine issue #1751 / 3.1.0):
#
#   listen 127.0.0.1:8080 ssl https_allow_http;
#
# Stock openresty/openresty:1.19.3.2 does NOT implement https_allow_http
# (nginx -t → invalid parameter). This file is the stock-compat FALLBACK:
# two internal listens in one server{} so the demo can still terminate TLS
# in OpenResty. That split is NOT the production model — see
# nginx.tengine-https-allow-http.conf.example and docs/openresty-p1.md.
#
# worker_processes 1 is intentional for this demo (reuseport / multi-worker
# sockmap is out of scope).

worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

# Pass through so Lua can read it (nginx otherwise clears the environment).
# Default unset/empty: do not send X-Waf-External-Port.
# Acceptance/debug: WAF_EXPOSE_EXTERNAL_PORT=1
env WAF_EXPOSE_EXTERNAL_PORT;

events {
    worker_connections 1024;
}

http {
    default_type  application/octet-stream;

    lua_package_path "$prefix/lua/?.lua;;";
    init_by_lua_block {
        require "resty.core"
    }

    log_format waf_m1 '$remote_addr:$remote_port $request '
                      'scheme=$scheme '
                      'internal_port=$server_port waf_external_port=$waf_external_port '
                      'status=$status';

    access_log logs/access.log waf_m1;

    server {
        # PRODUCT (Tengine / production OpenResty with https_allow_http):
        #   listen 127.0.0.1:8080 ssl https_allow_http;
        # That ONE listen accepts cleartext HTTP and TLS. sk_lookup steers
        # every external port here; it does not split protocols.
        # Live file below is stock 1.19.3.2 (no https_allow_http) — fallback only.
        listen 127.0.0.1:8080;        # stock: HTTP only
        listen 127.0.0.1:8443 ssl;    # stock fallback: TLS only (NOT the product model)
        server_name waf-p1;

        # Demo self-signed certs (make certs / openresty/certs/gen-demo-certs.sh).
        # Helper scripts rewrite these to absolute paths.
        ssl_certificate     certs/demo.crt;
        ssl_certificate_key certs/demo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Writable nginx var for Lua. Do not treat $server_port as the external port.
        set $waf_external_port '';
        # Set to 1 in this file to always expose debug headers (alternative to env).
        set $waf_expose_external_port '';

        access_by_lua_block {
            ngx.var.waf_external_port = require("waf.external_port").resolve()
        }

        location / {
            content_by_lua_block {
                local port = ngx.var.waf_external_port or ""
                require("waf.headers").apply_debug_headers(port)
                ngx.header.content_type = "text/plain"
                ngx.say("OpenResty M1 OK")
                ngx.say("waf_external_port=" .. port)
                ngx.say("server_port=" .. (ngx.var.server_port or ""))
                ngx.say("scheme=" .. (ngx.var.scheme or ""))
                ngx.say("remote_addr=" .. (ngx.var.remote_addr or ""))
            }
        }

        location /health {
            access_log off;
            content_by_lua_block {
                ngx.header.content_type = "text/plain"
                ngx.say("ok")
            }
        }
    }
}
