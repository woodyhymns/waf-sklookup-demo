worker_processes 1;
error_log stderr info;
pid logs/nginx.pid;
events { worker_connections 64; }
http {
    server {
        listen 127.0.0.1:8443 ssl https_allow_http;
        server_name hah-smoke;
        ssl_certificate     certs/demo.crt;
        ssl_certificate_key certs/demo.key;
        location / { return 200 "hah-ok\n"; }
    }
}
